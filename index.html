<!DOCTYPE html>
<html>
<head>
    <title>Website Temporarily Unavailable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #d9534f;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Website Temporarily Suspended</h1>

        <p>
            This website is currently unavailable due to a pending payment.
        </p>

        <p>
            Please contact the administrator or complete the payment process
            to restore access to the website.
        </p>
    </div>

</body>
</html>
